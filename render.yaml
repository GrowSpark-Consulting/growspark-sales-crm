# Documentation only — NOT applied as a Blueprint. See docs/decisions.md D69
# and the "Render: API" section of docs/STAGING.md for the full story: the
# web app (apps/web) is hosted on Vercel, not Render, so this file no longer
# describes a two-service Blueprint to click "Apply" on. It exists only so
# the API service's exact build/start commands live in one reviewable place
# you can diff against the actual manual Web Service settings in the Render
# dashboard — if you ever change one, change the other to match.
#
# region: singapore — closest Render region to the Supabase project's own
# Mumbai (ap-south-1) region; Render has no Mumbai region itself.

services:
  - type: web
    name: growspark-crm-api
    runtime: node
    plan: free
    region: singapore
    # Not `corepack enable && corepack prepare pnpm@11.10.0 --activate &&
    # pnpm install ...` — that failed on a real Render deploy with
    # `Internal Error: EROFS: read-only file system, unlink '/usr/bin/pnpm'`
    # (corepack's EnableCommand trying to replace Render's own pre-installed
    # pnpm shim at a path the build user can't write to). `corepack
    # pnpm@11.10.0 <args>` is Corepack's own documented one-shot form (its
    # README, "Utility Commands": "this meta-command runs the specified
    # package manager in the local folder") — it needs no `enable` step,
    # caches the pinned version under $HOME/.cache/node/corepack instead of
    # any system directory, and still validates against this repo's
    # `packageManager` field. See docs/decisions.md D70.
    buildCommand: >-
      corepack pnpm@11.10.0 install --frozen-lockfile &&
      corepack pnpm@11.10.0 --filter @growspark/shared build &&
      corepack pnpm@11.10.0 --filter api exec prisma generate &&
      corepack pnpm@11.10.0 --filter api build
    # Not `pnpm --filter api start` — that script runs
    # `node --env-file=.env dist/index.js`, and Node's --env-file fails hard
    # (exit code 9) if the file doesn't exist, which it never will on
    # Render (env vars are injected directly into process.env, no .env file
    # involved at all). src/env.ts already reads process.env directly with
    # no file-loading step of its own, so this just runs the compiled output.
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      # Required — see docs/decisions.md D70. Render's own fallback Node
      # source (this repo's package.json#engines.node, ">=22.12", no upper
      # bound) let a real deploy resolve to Node 26 instead of 22.
      # NODE_VERSION is Render's highest-precedence Node version source
      # (above .node-version/.nvmrc/engines.node per render.com/docs/
      # node-version) — pin it to exactly the version used locally.
      - key: NODE_VERSION
        value: 22.20.0
      # production — enables Secure cookies (src/lib/cookies.ts) and the
      # permission-map validation; see the "What each variable means" table
      # in docs/STAGING.md.
      - key: NODE_ENV
        sync: false
      # staging — distinct from NODE_ENV=production; see docs/decisions.md
      # D64 for why both exist.
      - key: APP_ENV
        sync: false
      # PORT is deliberately NOT listed here — Render assigns and injects
      # its own PORT automatically, and src/env.ts already defaults to it
      # correctly. Declaring it here would just invite overriding a value
      # Render needs to control itself.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        sync: false
      - key: DATABASE_POOL_MAX
        sync: false
      # Paste the downloaded Supabase CA certificate's own PEM text here
      # directly (the whole -----BEGIN CERTIFICATE----- block), not a file
      # path -- Render has no filesystem path you control to point at. See
      # "The CA certificate on Render" in docs/STAGING.md.
      - key: DATABASE_SSL_CA
        sync: false
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        sync: false
      # The web app's Vercel URL (e.g. https://growspark-crm.vercel.app),
      # not a Render address — see docs/STAGING.md's "Order of operations".
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: SESSION_TTL_DAYS
        sync: false

# The web app (apps/web) used to be a second service here. It is now a
# Vercel project instead — see docs/STAGING.md's "Vercel: web" section for
# its Root Directory, Install/Build Command, and environment variable
# (API_INTERNAL_URL, pointed at this service's own Render URL).
