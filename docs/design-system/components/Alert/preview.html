<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert — preview</title></head>
<body>
<div class="gs-demo-col">
  <div class="gs-alert gs-alert-info" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div><strong>Payroll runs on the 28th.</strong> Approve pending timesheets before then.</div></div>
  <div class="gs-alert gs-alert-success" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><div><strong>Invoice sent.</strong> The client will get it by email in a few minutes.</div></div>
  <div class="gs-alert gs-alert-warning" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><div><strong>3 tasks are due tomorrow.</strong> Review the Website Redesign board.</div></div>
  <div class="gs-alert gs-alert-danger" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><div><strong>Couldn't import 12 contacts.</strong> Phone numbers are missing. Download the error report.</div></div>
</div>
</body>
</html>
