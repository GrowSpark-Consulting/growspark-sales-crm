<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grow Spark Workspace</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--ink); }
  .moss { fill:var(--primary); }
  .clay { fill:var(--accent); }
  .slate { fill:var(--info); }
  .ochre { fill:var(--data-4); }
  .cut { fill:var(--bg); }
  .blk { rx:var(--radius-lg); }
  .tile { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 96×258 slab bled off the top (the dark sidebar) · primary moss 152×176 (largest colour) · accent clay 96×128 · info slate 152×40 · data-4 ochre 40×40 — ≈45% of the box
  arrangement a flush modular grid like the app shell: dark slab left, content tiles right, bottoms on one line space-10 above the edge, space-2 gutters
  pattern     tiles, from "One family, three products … same sidebar, same tables": a column of 40px tiles at a space-12 pitch bleeding off the right, two merged two-wide, plus three tiles cut out of the moss block in bg
  scales      gutters space-2 (8); pitch space-12 (48); sides in space-2 multiples; corners radius-lg on blocks, radius-md on tiles
-->
<rect class="deep blk" x="24" y="-10" width="96" height="258" rx="10"/>
<rect class="moss blk" x="128" y="24" width="152" height="176" rx="10"/>
<rect class="cut tile" x="144" y="152" width="32" height="32" rx="6"/>
<rect class="cut tile" x="184" y="152" width="32" height="32" rx="6"/>
<rect class="cut tile" x="224" y="152" width="40" height="32" rx="6"/>
<rect class="slate blk" x="128" y="208" width="152" height="40" rx="10"/>
<rect class="clay blk" x="288" y="72" width="96" height="128" rx="10"/>
<rect class="ochre tile" x="288" y="208" width="40" height="40" rx="6"/>
<rect class="deep tile" x="336" y="208" width="48" height="40" rx="6"/>
<rect class="clay tile" x="288" y="24" width="40" height="40" rx="6"/>
<rect class="slate tile" x="336" y="24" width="48" height="40" rx="6"/>
<rect class="moss tile" x="392" y="24" width="96" height="40" rx="6"/>
<rect class="deep tile" x="392" y="72" width="40" height="40" rx="6"/>
<rect class="ochre tile" x="440" y="72" width="48" height="40" rx="6"/>
<rect class="slate tile" x="392" y="120" width="40" height="40" rx="6"/>
<rect class="clay tile" x="440" y="120" width="48" height="40" rx="6"/>
<rect class="moss tile" x="392" y="168" width="96" height="32" rx="6"/>
<rect class="deep tile" x="392" y="208" width="40" height="40" rx="6"/>
<rect class="moss tile" x="440" y="208" width="48" height="40" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Grow Spark<br>Workspace</h1>
<p class="tag">Calm, warm and readable — built for long workdays.</p>
</div>
</div>
</body>
</html>
